plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'net.leviro.ringer'
    compileSdk 34

    defaultConfig {
        applicationId "net.leviro.ringer"
        minSdk 23                 // Android 6.0
        targetSdk 34              // Android 14
        versionCode 1
        versionName "1.0"
        resourceConfigurations += ['en', 'ar']
    }

    buildTypes {
        release {
            minifyEnabled false   // keep simple for sideloading; no networking to obfuscate
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // First-party AndroidX / Google Material only. No networking, no analytics, no third-party libs.
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'
}
